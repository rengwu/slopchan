name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test Go and container
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64, linux/arm/v6, linux/arm/v7]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test and vet
        if: matrix.platform == 'linux/amd64'
        run: |
          go test -race ./...
          go vet ./...
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          tags: slopchan:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test container permissions, API, and persistent storage
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
        run: bash deploy/smoke-container.sh slopchan:test
      - name: Exercise Unix installer in an isolated account
        if: matrix.platform == 'linux/amd64'
        run: |
          docker run --rm -v "$PWD:/src:ro" python:3.13-alpine sh -c \
            'apk add --no-cache openssl && adduser -D installer && su installer -c "python /src/scripts/test-installer.py"'

  native:
    name: Native tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Test, build, and exercise the executable
        shell: bash
        run: |
          go test ./...
          go vet ./...
          CGO_ENABLED=0 go build -o bin/slopchan.exe .
          python scripts/smoke-native.py bin/slopchan.exe
      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/deploy/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }

  archives:
    name: Build every native release archive
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Build archives and checksums
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
        run: python scripts/release.py "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-archives
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release to GHCR
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, native, archives]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate release and select image
        id: release
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tags must have the form v1.2.3 (stable releases only).' >&2
            exit 1
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish x86-64, ARM64, ARMv6, and ARMv7 images
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7
          build-args: VERSION=${{ steps.release.outputs.version }}
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=min
          sbom: true
      - name: Report published package
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          {
            echo "Published: $IMAGE:$VERSION and $IMAGE:latest"
            echo
            echo 'Platforms: linux/amd64, linux/arm64, linux/arm/v6, linux/arm/v7.'
            echo 'For the first release, set the package visibility to Public in GitHub package settings so Unraid can pull without credentials.'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish GitHub release downloads
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-archives
          path: dist
      - name: Publish archives and installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* deploy/install.sh deploy/install.ps1 deploy/unraid/slopchan.xml \
            --verify-tag --title "slopchan ${RELEASE_TAG#v}" --notes-file "docs/release-${RELEASE_TAG#v}.md"

  verify-downloads:
    name: Install public release (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Download and install on Unix without credentials
        if: runner.os != 'Windows'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          curl --retry 5 --retry-all-errors -fsSL "https://github.com/rengwu/slopchan/releases/download/$RELEASE_TAG/install.sh" -o /tmp/slopchan-install.sh
          sh /tmp/slopchan-install.sh "$RELEASE_TAG"
          "$HOME/.local/bin/slopchan" version
          python scripts/smoke-native.py "$HOME/.local/bin/slopchan"
      - name: Download and install on Windows without credentials
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          Invoke-WebRequest "https://github.com/rengwu/slopchan/releases/download/$env:RELEASE_TAG/install.ps1" -OutFile "$env:RUNNER_TEMP/install.ps1"
          & "$env:RUNNER_TEMP/install.ps1" -Version $env:RELEASE_TAG
          & "$env:LOCALAPPDATA/slopchan/slopchan.exe" version
          python scripts/smoke-native.py "$env:LOCALAPPDATA/slopchan/slopchan.exe"
