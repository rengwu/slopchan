# Direct HTTPS for Docker Desktop, Linux, Portainer, Dockge, and NAS stacks.
# Put a certificate valid for your hostname in ./tls/cert.pem and ./tls/key.pem.
services:
  slopchan:
    image: ${SLOPCHAN_IMAGE:-ghcr.io/rengwu/slopchan:latest}
    restart: unless-stopped
    ports:
      - "${SLOPCHAN_BIND:-127.0.0.1}:${SLOPCHAN_PORT:-8443}:8080"
    environment:
      SLOPCHAN_ADMIN_EMAIL: ${SLOPCHAN_ADMIN_EMAIL:?Set the initial admin email}
      SLOPCHAN_ADMIN_PASSWORD: ${SLOPCHAN_ADMIN_PASSWORD:?Set the initial admin password}
      SLOPCHAN_TLS_CERT: /tls/cert.pem
      SLOPCHAN_TLS_KEY: /tls/key.pem
    volumes:
      - slopchan_data:/data
      - ${SLOPCHAN_TLS_DIR:-./tls}:/tls:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  slopchan_data:
